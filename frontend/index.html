<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование апартаментов</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-8">

    <div class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-bold mb-2 text-center text-indigo-600">Поиск и бронирование</h1>
        <p class="text-gray-500 text-center mb-10">Выберите интересующие апартаменты, чтобы посмотреть свободные даты</p>
        
        <div id="listings-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </div>

    <div id="details-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50 transition-opacity duration-300">
        <div class="bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden shadow-2xl flex flex-col md:flex-row relative">
            
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-white bg-opacity-80 hover:bg-white text-gray-700 font-bold p-2 rounded-full shadow z-10 w-10 h-10 flex items-center justify-center transition-colors">
                ✕
            </button>

            <div class="md:w-1/2 h-64 md:h-auto relative bg-gray-200">
                <img id="modal-image" src="" alt="Apartment photo" class="w-full h-full object-cover">
            </div>

            <div class="md:w-1/2 p-8 flex flex-col justify-between overflow-y-auto max-h-[calc(90vh-100px)] md:max-h-[90vh]">
                <div>
                    <h2 id="modal-title" class="text-2xl font-bold text-gray-900 mb-2"></h2>
                    <p id="modal-price" class="text-xl font-semibold text-indigo-600 mb-4"></p>

                    <div class="mb-4">
                        <span class="text-sm font-semibold text-gray-600 block mb-2">Июнь 2026:</span>
                        <div id="dates-calendar-status" class="grid grid-cols-7 gap-1 text-center text-sm font-medium">
                            </div>
                    </div>

                    <div class="space-y-4 border-t pt-4 border-gray-100">
                        <div class="flex space-x-4">
                            <div class="w-1/2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Дата заезда</label>
                                <input type="date" id="check-in" min="2026-06-01" max="2026-06-30" onchange="handleInputChange()" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm">
                            </div>
                            <div class="w-1/2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Дата выезда</label>
                                <input type="date" id="check-out" min="2026-06-01" max="2026-06-30" onchange="handleInputChange()" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm">
                            </div>
                        </div>
                        <p id="selection-info" class="text-gray-500 text-sm mt-2 h-5">Кликните на свободные (зеленые) даты в календаре или введите их вручную.</p>
                    </div>
                </div>

                <div class="mt-6">
                    <button id="book-btn" onclick="executeBooking()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-lg shadow-indigo-100 disabled:bg-gray-300 disabled:shadow-none disabled:cursor-not-allowed">
                        Забронировать
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 text-white px-6 py-3 rounded-xl shadow-xl hidden transition-all duration-300 transform z-50">
        <span id="toast-message"></span>
    </div>

    <script>
        const listings = [
            {
                id: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11",
                title: "Уютная студия в центре Питера",
                price: "1 500.50 ₽ / ночь",
                image: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=600&q=80",
                bookedDays: [5, 6, 7, 12, 13, 14, 20] 
            },
            {
                id: "b1eebc99-9c0b-4ef8-bb6d-6bb9bd380a22",
                title: "Лофт с панорамными окнами у реки",
                price: "3 200.00 ₽ / ночь",
                image: "https://images.unsplash.com/photo-1502672260266-1c1e52409818?auto=format&fit=crop&w=600&q=80",
                bookedDays: [1, 2, 3, 15, 16, 17, 18, 28, 29, 30]
            }
        ];

        let currentSelectedListingId = null;
        let selectionStart = null;
        let selectionEnd = null;

        // Отрисовка карточек
        const container = document.getElementById('listings-container');
        listings.forEach(listing => {
            const card = document.createElement('div');
            card.className = "bg-white rounded-2xl shadow-sm overflow-hidden hover:shadow-xl transition-all duration-300 cursor-pointer transform hover:-translate-y-1 border border-gray-100";
            card.setAttribute('onclick', `openModal('${listing.id}')`);
            card.innerHTML = `
                <div class="relative">
                    <img src="${listing.image}" alt="Apartment" class="w-full h-56 object-cover">
                </div>
                <div class="p-6">
                    <h2 class="text-xl font-bold mb-2 text-gray-800 line-clamp-1">${listing.title}</h2>
                    <p class="text-indigo-600 font-semibold">${listing.price}</p>
                </div>
            `;
            container.appendChild(card);
        });

        function openModal(id) {
            const listing = listings.find(l => l.id === id);
            if (!listing) return;

            currentSelectedListingId = id;
            selectionStart = null;
            selectionEnd = null;

            document.getElementById('modal-image').src = listing.image;
            document.getElementById('modal-title').textContent = listing.title;
            document.getElementById('modal-price').textContent = listing.price;
            
            // Сбрасываем инпуты
            document.getElementById('check-in').value = '';
            document.getElementById('check-out').value = '';
            document.getElementById('book-btn').disabled = true;

            renderCalendar();

            document.getElementById('details-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('details-modal').classList.add('hidden');
            currentSelectedListingId = null;
        }

        // Рендер интерактивного календаря
        function renderCalendar() {
            const listing = listings.find(l => l.id === currentSelectedListingId);
            const calendarContainer = document.getElementById('dates-calendar-status');
            calendarContainer.innerHTML = '';

            for (let day = 1; day <= 30; day++) {
                const dayNode = document.createElement('div');
                const isBooked = listing.bookedDays.includes(day);
                
                let isSelected = false;
                let isBetween = false;

                if (selectionStart === day || selectionEnd === day) isSelected = true;
                if (selectionStart && selectionEnd && day > selectionStart && day < selectionEnd) isBetween = true;

                let classes = "p-1.5 rounded-lg text-center transition-all duration-200 select-none ";

                if (isBooked) {
                    classes += "bg-red-50 text-red-400 line-through border border-red-100 cursor-not-allowed opacity-60";
                } else if (isSelected || isBetween) {
                    classes += "bg-yellow-300 text-yellow-900 font-bold shadow-md cursor-pointer transform scale-105";
                    dayNode.onclick = () => handleDayClick(day);
                } else {
                    classes += "bg-green-50 text-green-700 border border-green-100 cursor-pointer hover:bg-green-200 hover:shadow";
                    dayNode.onclick = () => handleDayClick(day);
                }

                dayNode.className = classes;
                dayNode.innerHTML = `<div>${day}</div>`;
                calendarContainer.appendChild(dayNode);
            }

            updateUIState();
        }

        // Логика при ручном вводе дат в инпуты
        function handleInputChange() {
            const inVal = document.getElementById('check-in').value;
            const outVal = document.getElementById('check-out').value;
            
            // Извлекаем число из даты (формат YYYY-MM-DD)
            selectionStart = inVal ? parseInt(inVal.split('-')[2], 10) : null;
            selectionEnd = outVal ? parseInt(outVal.split('-')[2], 10) : null;

            if (selectionStart && selectionEnd && selectionStart > selectionEnd) {
                showToast("Дата выезда не может быть раньше заезда", "bg-red-500");
                document.getElementById('book-btn').disabled = true;
                renderCalendar();
                return;
            }

            validateAndRender();
        }

        // Логика выбора дат при клике на календарь
        function handleDayClick(day) {
            const listing = listings.find(l => l.id === currentSelectedListingId);
            
            if (listing.bookedDays.includes(day)) return;

            if (!selectionStart || (selectionStart && selectionEnd)) {
                selectionStart = day;
                selectionEnd = null;
            } else {
                if (day < selectionStart) {
                    selectionEnd = selectionStart;
                    selectionStart = day;
                } else {
                    selectionEnd = day;
                }
            }

            // Синхронизируем инпуты с кликами
            if (selectionStart) {
                document.getElementById('check-in').value = `2026-06-${String(selectionStart).padStart(2, '0')}`;
            } else {
                document.getElementById('check-in').value = '';
            }

            if (selectionEnd) {
                document.getElementById('check-out').value = `2026-06-${String(selectionEnd).padStart(2, '0')}`;
            } else {
                document.getElementById('check-out').value = '';
            }

            validateAndRender();
        }

        // Общая проверка на пересечение дат
        function validateAndRender() {
            const listing = listings.find(l => l.id === currentSelectedListingId);
            let hasOverlap = false;

            if (selectionStart && selectionEnd) {
                for (let d = selectionStart; d <= selectionEnd; d++) {
                    if (listing.bookedDays.includes(d)) {
                        hasOverlap = true;
                        break;
                    }
                }
            }

            if (hasOverlap) {
                showToast("В выбранном диапазоне есть занятые даты!", "bg-red-500");
                selectionEnd = null; // Сбрасываем конец, оставляем начало
                document.getElementById('check-out').value = '';
            }

            renderCalendar();
        }

        // Обновление текста и состояния кнопки
        function updateUIState() {
            const infoEl = document.getElementById('selection-info');
            const bookBtn = document.getElementById('book-btn');

            if (!selectionStart) {
                infoEl.innerHTML = `<span class="text-gray-500">Кликните на свободные (зеленые) даты в календаре.</span>`;
                bookBtn.disabled = true;
            } else if (selectionStart && !selectionEnd) {
                infoEl.innerHTML = `<span class="text-indigo-600 font-medium">Заезд: ${selectionStart} Июня. Выберите дату выезда.</span>`;
                bookBtn.disabled = true;
            } else {
                infoEl.innerHTML = `<span class="text-green-600 font-bold">Выбрано: ${selectionStart} Июня — ${selectionEnd} Июня</span>`;
                bookBtn.disabled = false; // Кнопка активна только когда выбраны обе даты
            }
        }

        // Отправка запроса на бэкенд
        async function executeBooking() {
            if (!currentSelectedListingId || !selectionStart || !selectionEnd) return;

            try {
                showToast("Бронируем...", "bg-blue-500");

                const response = await fetch("http://localhost:8082/book", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        listing_id: currentSelectedListingId, 
                        user_id: "a3eebc99-9c0b-4ef8-bb6d-6bb9bd380a99"
                    }) 
                });

                if (response.ok) {
                    showToast("Успешно забронировано!", "bg-green-500");
                    
                    // Перекрашиваем желтые даты в красные (занятые) для текущей сессии
                    const listing = listings.find(l => l.id === currentSelectedListingId);
                    for (let d = selectionStart; d <= selectionEnd; d++) {
                        if (!listing.bookedDays.includes(d)) {
                            listing.bookedDays.push(d);
                        }
                    }
                    
                    // Сбрасываем выбранные даты для возможности бронировать снова
                    selectionStart = null;
                    selectionEnd = null;
                    document.getElementById('check-in').value = '';
                    document.getElementById('check-out').value = '';
                    
                    renderCalendar();

                    setTimeout(() => closeModal(), 1500);
                } else {
                    showToast("Ошибка при бронировании на сервере", "bg-red-500");
                }
            } catch (error) {
                console.error("Ошибка сети:", error);
                showToast("Сервер недоступен", "bg-red-500");
            }
        }

        function showToast(message, colorClass) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            
            toast.className = `fixed bottom-5 right-5 text-white px-6 py-3 rounded-xl shadow-xl transition-all duration-300 ${colorClass}`;
            msgEl.textContent = message;
            toast.classList.remove('hidden');

            setTimeout(() => toast.classList.add('hidden'), 3000);
        }
    </script>
</body>
</html>
